apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ledgerqueue
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ledgerqueue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ledgerqueue:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/api"]
          envFrom:
            - configMapRef:
                name: ledgerqueue-config
          env:
            - name: ADDR
              value: ":8080"
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
