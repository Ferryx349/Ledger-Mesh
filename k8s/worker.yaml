apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ledgerqueue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ledgerqueue:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/worker"]
          envFrom:
            - configMapRef:
                name: ledgerqueue-config
          env:
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
